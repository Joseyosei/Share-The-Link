name: Founder intelligence checks
on:
  pull_request:
    branches: [main, stage-03-founder-intelligence, stage-04-creator-onboarding, stage-05-commerce, stage-06-monetisation, stage-07-storefront-studio, stage-07-02-social-content, stage-08-ai-creator]
  push:
    branches: [stage-03-founder-intelligence, stage-04-creator-onboarding, stage-05-commerce, stage-06-monetisation, stage-07-storefront-studio, stage-07-02-social-content, stage-08-ai-creator, stage-08-01-local-ai, release/stages-01-08, main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/founder-metrics.test.ts tests/creator-onboarding.test.ts tests/commerce.test.ts tests/plan-policy.test.ts tests/storefront-studio.test.ts tests/social-media.test.ts tests/social-content.test.ts tests/creator-ai.test.ts tests/local-ai.test.ts tests/production-release.test.ts
      - run: pnpm build
