name: Dashboard checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stage-02-billing-reliability]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/dashboard-navigation.test.ts tests/billing-contract.test.ts
      - run: pnpm build
